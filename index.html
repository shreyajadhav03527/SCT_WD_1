
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom Flower Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#fff8fb;
    color:#333;
}

/* ===== Navigation ===== */
nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 60px;
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(10px);
    transition:.4s;
    z-index:1000;
}

nav.scrolled{
    background:#e91e63;
    padding:12px 60px;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.logo{
    color:#e91e63;
    font-size:28px;
    font-weight:bold;
}

nav.scrolled .logo{
    color:white;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
    transition:.3s;
    padding:8px 12px;
    border-radius:20px;
}

nav ul li a:hover{
    background:#ff69b4;
    color:white;
    transform:translateY(-3px);
}

nav.scrolled ul li a{
    color:white;
}

nav.scrolled ul li a:hover{
    background:white;
    color:#e91e63;
}

/* ===== Hero ===== */
.hero{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1400&q=80');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    padding:20px;
}

.hero h1{
    font-size:55px;
}

.hero p{
    margin:20px 0;
    font-size:20px;
}

.btn{
    background:#e91e63;
    color:white;
    padding:14px 28px;
    text-decoration:none;
    border-radius:30px;
    transition:.3s;
}

.btn:hover{
    background:white;
    color:#e91e63;
}

/* ===== Products ===== */
.products{
    padding:90px 8%;
}

.products h2{
    text-align:center;
    color:#e91e63;
    margin-bottom:40px;
    font-size:36px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h3{
    padding:15px;
}

.price{
    color:#e91e63;
    font-weight:bold;
    padding:0 15px 20px;
}

/* Footer */
footer{
    background:#e91e63;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<nav id="navbar">
    <div class="logo">🌸 Bloom</div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#flowers">Flowers</a></li>
        <li><a href="#">Bouquets</a></li>
        <li><a href="#">Offers</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<section class="hero">
    <div>
        <h1>Fresh Flowers Delivered Daily</h1>
        <p>Beautiful bouquets for every special moment.</p>
        <a href="#flowers" class="btn">Shop Now</a>
    </div>
</section>

<section class="products" id="flowers">
    <h2>Our Best Sellers</h2>

    <div class="grid">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=600&q=80">
            <h3>Red Rose Bouquet</h3>
            <div class="price">₹799</div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1520763185298-1b434c919102?auto=format&fit=crop&w=600&q=80">
            <h3>Pink Tulips</h3>
            <div class="price">₹699</div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1468327768560-75b778cbb551?auto=format&fit=crop&w=600&q=80">
            <h3>White Lilies</h3>
            <div class="price">₹899</div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1470509037663-253afd7f0f51?auto=format&fit=crop&w=600&q=80">
            <h3>Sunflower Bundle</h3>
            <div class="price">₹599</div>
        </div>

    </div>
</section>

<footer>
    © 2026 Bloom Flower Shop | Made with ❤
</footer>

<script>
// Change navbar style on scroll
window.addEventListener("scroll", function(){
    const nav = document.getElementById("navbar");

    if(window.scrollY > 50){
        nav.classList.add("scrolled");
    }else{
        nav.classList.remove("scrolled");
    }
});
</script>

</body>
</html>
